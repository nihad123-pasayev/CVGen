<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVGen-login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

</head>

<body class="loginbody">
    <div class="general">
        <p class="loginlabel">CVGen</p>
        <p class="logintext">Log in to your account</p>
        <form action="/users" method="POST" id="signupform">
            <label for="name" class="label">Full Name:</label><br>
            <div class="input-wrapper">
                <i class="ti ti-user"></i>
                <input type="text" id="full-name" name="full-name" class="logininput" placeholder="Full Name">
            </div>
            <label for="email" class="label">Email:</label><br>
            <div class="input-wrapper">
                <i class="ti ti-mail"></i>
                <input type="email" id="email" name="email" class="logininput" placeholder="name@example.com">
            </div>
            <label for="password" class="label">Password:</label><br>
            <div class="input-wrapper">
                <i class="ti ti-key"></i>
                <input type="password" id="password" name="password" class="logininput password-field"
                    placeholder="•••••••••">
                <i class="ti ti-eye toggle-password"></i>
            </div>
            <label for="confirm-password" class="label">Confirm Password:</label><br>
            <div class="input-wrapper">
                <i class="ti ti-key"></i>
                <input type="password" id="confirm-password" name="confirm-password" class="logininput password-field"
                    placeholder="•••••••••">
                <i class="ti ti-eye toggle-password"></i>

            </div>
            <button class="enterbtn" type="submit">Sign Up</button>
        </form>


        <p class="hvnt-text">Already have an account?<a href="login.html" class="sign-up">Log In</a></p>


    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="database.js" defer></script>
    <script src="app.js" defer></script>
</body>

</html>
